<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Reportalo - Tu ciudad. Tu voz. Próximamente." />
  <title>Reportalo — Próximamente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#249EE1', light: '#EBF6FC', dark: '#266AA6' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-fade-in { animation: fade-in 0.5s ease-out forwards; opacity: 0; }
    .animate-fade-in-delay { animation: fade-in 0.5s ease-out 0.15s forwards; opacity: 0; }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased">

  <div class="min-h-[100dvh] w-full flex flex-col items-center justify-center px-6">

    <!-- Logo -->
    <div class="animate-fade-in">
      <img
        src="https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp"
        alt="Reportalo"
        class="w-28 h-32 object-contain select-none"
      />
    </div>

    <!-- Nombre -->
    <h1 class="animate-fade-in-delay text-2xl font-extrabold tracking-tight text-slate-900 mt-4">
      Reportalo
    </h1>

    <!-- Subtítulo -->
    <p class="animate-fade-in-delay text-sm text-slate-400 mt-2">
      Próximamente
    </p>

  </div>

</body>
</html>
