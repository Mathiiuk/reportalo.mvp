<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Reportalo - Tu ciudad. Tu voz. Próximamente." />
  <title>Reportalo — Próximamente</title>

  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#249EE1', light: '#EBF6FC', dark: '#266AA6' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      background: #f8f9fa;
    }

    /* Entrada del logo */
    @keyframes logo-enter {
      0% { opacity: 0; transform: scale(0.8); }
      60% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-logo { animation: logo-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; }

    /* Esquinas del viewfinder de cámara */
    @keyframes corner-draw {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    /* Anillo de enfoque pulsante */
    @keyframes focus-pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 0.2; }
    }

    /* Flash de captura periódico */
    @keyframes capture-flash {
      0%, 90%, 100% { opacity: 0; }
      92% { opacity: 0.7; }
      95% { opacity: 0; }
      97% { opacity: 0.3; }
    }

    /* Punto de enfoque central */
    @keyframes focus-dot {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
    }

    .viewfinder-corners {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: corner-draw 1.2s ease-out 0.3s forwards;
    }

    .focus-ring {
      animation: focus-pulse 2.5s ease-in-out infinite;
    }

    .flash-overlay {
      animation: capture-flash 4s ease-in-out infinite;
    }

    .focus-point {
      animation: focus-dot 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <div class="min-h-[100dvh] w-full flex flex-col items-center justify-center px-6">

    <!-- Logo con efecto cámara -->
    <div class="animate-logo relative">

      <!-- Flash overlay -->
      <div class="flash-overlay absolute inset-0 bg-white rounded-full pointer-events-none z-10"></div>

      <!-- Anillo de enfoque -->
      <div class="focus-ring absolute -inset-4 border-2 border-primary/30 rounded-full pointer-events-none"></div>

      <!-- SVG Viewfinder corners -->
      <svg class="absolute -inset-5 w-[calc(100%+40px)] h-[calc(100%+40px)] pointer-events-none z-10" viewBox="0 0 120 140" fill="none">
        <!-- Esquina superior izquierda -->
        <path class="viewfinder-corners" d="M8 30 L8 8 L30 8" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" />
        <!-- Esquina superior derecha -->
        <path class="viewfinder-corners" d="M90 8 L112 8 L112 30" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" />
        <!-- Esquina inferior izquierda -->
        <path class="viewfinder-corners" d="M8 110 L8 132 L30 132" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" />
        <!-- Esquina inferior derecha -->
        <path class="viewfinder-corners" d="M90 132 L112 132 L112 110" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" />
      </svg>

      <!-- Punto de enfoque central -->
      <div class="focus-point absolute top-1/2 left-1/2 w-2 h-2 bg-primary rounded-full pointer-events-none z-10"></div>

      <!-- Logo -->
      <img
        src="https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp"
        alt="Reportalo"
        class="relative w-28 h-32 object-contain select-none z-0"
      />
    </div>

  </div>

</body>
</html>
