<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Reportalo - Tu ciudad. Tu voz. Próximamente." />
  <title>Reportalo — Próximamente</title>

  <link rel="icon" type="image/webp" href="./public/logo-icon.webp" />
  <link rel="apple-touch-icon" href="./public/logo-icon.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#249EE1', light: '#EBF6FC', dark: '#266AA6' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      background: #0f172a;
      overflow: hidden;
    }

    /* Entrada suave de la escena */
    @keyframes camera-intro {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    .camera-rig {
      animation: camera-intro 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Ciclo de encuadre y respiración del visor */
    @keyframes viewfinder-hud {
      0%, 100% { transform: scale(1.03); opacity: 0.75; }
      35% { transform: scale(1); opacity: 0.9; }
      44% { transform: scale(0.98); opacity: 1; filter: drop-shadow(0 0 8px rgba(36, 158, 225, 0.8)); }
      48%, 56% { transform: scale(0.97); opacity: 1; filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9)); }
      58% { transform: scale(1.05); }
      70% { transform: scale(1); opacity: 0.8; filter: none; }
    }
    .animate-viewfinder {
      animation: viewfinder-hud 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Dibujo inicial de las esquinas */
    @keyframes corner-draw {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .viewfinder-corner-path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: corner-draw 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Indicador de autofoco (cambio de azul a verde de bloqueo y pulso) */
    @keyframes af-status-color {
      0%, 40% { stroke: #249EE1; color: #249EE1; }
      45%, 55% { stroke: #10B981; color: #10B981; }
      60%, 100% { stroke: #249EE1; color: #249EE1; }
    }
    .af-target {
      animation: af-status-color 4.5s ease-in-out infinite;
    }

    /* Retícula de enfoque central pulsante */
    @keyframes reticle-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
      35% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
      45%, 52% { transform: translate(-50%, -50%) scale(0.88); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
      65% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    }
    .animate-reticle {
      animation: reticle-pulse 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Destello de Flash de alta intensidad */
    @keyframes photo-flash {
      0%, 49.9% { opacity: 0; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      52% { opacity: 0.95; transform: scale(1.08); }
      56% { opacity: 0.4; transform: scale(1.02); }
      65% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; }
    }
    .animate-flash {
      animation: photo-flash 4.5s ease-out infinite;
    }

    /* Flash ambiental de pantalla completa */
    @keyframes ambient-flash {
      0%, 49.9% { opacity: 0; }
      50% { opacity: 0.65; }
      53% { opacity: 0.2; }
      60% { opacity: 0; }
      100% { opacity: 0; }
    }
    .animate-ambient-flash {
      animation: ambient-flash 4.5s ease-out infinite;
    }

    /* Retroceso del obturador y rebote del logo */
    @keyframes shutter-snap {
      0%, 48% { transform: scale(1); }
      50% { transform: scale(0.91) translateY(2px); filter: brightness(1.6) contrast(1.1); }
      53% { transform: scale(1.05) translateY(-1px); filter: brightness(1.2); }
      58% { transform: scale(0.99) translateY(0); filter: brightness(1); }
      64%, 100% { transform: scale(1); filter: brightness(1); }
    }
    .animate-shutter-logo {
      animation: shutter-snap 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    /* Destello de brillo sobre el logo pos-foto (Lens Sheen) */
    @keyframes lens-sheen {
      0%, 52% { transform: translateX(-120%) rotate(25deg); opacity: 0; }
      54% { opacity: 0.8; }
      62% { transform: translateX(180%) rotate(25deg); opacity: 0; }
      100% { opacity: 0; }
    }
    .animate-sheen {
      animation: lens-sheen 4.5s ease-out infinite;
    }

    /* HUD status text */
    @keyframes hud-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }
    .animate-record-dot {
      animation: hud-blink 1.2s infinite;
    }

    /* Disparo manual interactivo */
    .manual-snap .animate-flash {
      animation: none !important;
      opacity: 1 !important;
      transition: opacity 0.4s ease-out;
    }
    .manual-snap .animate-ambient-flash {
      animation: none !important;
      opacity: 0.7 !important;
      transition: opacity 0.4s ease-out;
    }
    .manual-snap .animate-shutter-logo {
      animation: none !important;
      transform: scale(0.92) !important;
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased select-none overflow-hidden">

  <!-- Flash de pantalla completa de captura -->
  <div id="ambientFlash" class="animate-ambient-flash fixed inset-0 bg-white pointer-events-none z-50"></div>

  <!-- Fondo con rejilla sutil de visor fotográfico -->
  <div class="fixed inset-0 pointer-events-none opacity-10">
    <div class="w-full h-full" style="background-image: radial-gradient(rgba(36,158,225,0.4) 1px, transparent 1px); background-size: 32px 32px;"></div>
  </div>

  <div class="min-h-[100dvh] w-full flex flex-col items-center justify-center px-6 relative z-10">

    <!-- Tarjeta Principal / Cámara Rig -->
    <div id="cameraRig" class="camera-rig relative flex flex-col items-center cursor-pointer group" title="Haz clic para tomar una foto">

      <!-- HUD Superior: Indicadores de cámara -->
      <div class="flex items-center justify-between w-full max-w-[260px] px-2 mb-3 text-[11px] font-mono tracking-wider text-slate-400">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-record-dot"></span>
          <span class="font-semibold text-slate-300">REC</span>
        </div>
        <div class="af-target font-bold flex items-center gap-1 text-[#249EE1]">
          <span>[ AF-C ]</span>
        </div>
        <div class="text-slate-400 font-medium">
          <span>4K • HDR</span>
        </div>
      </div>

      <!-- Contenedor del Logo y Visor -->
      <div class="relative p-7 sm:p-9 flex items-center justify-center">

        <!-- Visor HUD animado (Esquinas y retícula de encuadre) -->
        <div class="animate-viewfinder absolute inset-0 pointer-events-none">
          <svg class="w-full h-full af-target" viewBox="0 0 220 220" fill="none">
            <!-- Esquina Superior Izquierda -->
            <path class="viewfinder-corner-path" d="M12 44 L12 12 L44 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Esquina Superior Derecha -->
            <path class="viewfinder-corner-path" d="M176 12 L208 12 L208 44" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Esquina Inferior Izquierda -->
            <path class="viewfinder-corner-path" d="M12 176 L12 208 L44 208" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Esquina Inferior Derecha -->
            <path class="viewfinder-corner-path" d="M176 208 L208 208 L208 176" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Marcadores milimétricos del visor -->
            <line x1="110" y1="8" x2="110" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6" />
            <line x1="110" y1="202" x2="110" y2="212" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6" />
            <line x1="8" y1="110" x2="18" y2="110" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6" />
            <line x1="202" y1="110" x2="212" y2="110" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6" />
          </svg>
        </div>

        <!-- Retícula central de autofoco (Target Box) -->
        <div class="animate-reticle absolute top-1/2 left-1/2 w-16 h-16 border border-[#249EE1]/50 rounded-lg pointer-events-none flex items-center justify-center">
          <div class="w-2 h-2 rounded-full bg-[#249EE1] shadow-[0_0_8px_#249EE1]"></div>
          <!-- Micro marcas cruzadas -->
          <div class="absolute w-full h-[1px] bg-[#249EE1]/20"></div>
          <div class="absolute h-full w-[1px] bg-[#249EE1]/20"></div>
        </div>

        <!-- Destello de Flash sobre el logo (Burst Luminous) -->
        <div class="animate-flash absolute inset-0 bg-white rounded-3xl pointer-events-none z-30 shadow-[0_0_120px_60px_rgba(255,255,255,0.95)]"></div>

        <!-- Contenedor del Logo con Efecto Shutter y Reflejo de Lente -->
        <div class="animate-shutter-logo relative z-20 overflow-hidden rounded-2xl flex items-center justify-center p-2">
          
          <!-- Destello diagonal de lente (Lens Sheen) -->
          <div class="animate-sheen absolute inset-0 w-1/2 h-full bg-gradient-to-r from-transparent via-white/60 to-transparent pointer-events-none z-20 transform -skew-x-12"></div>

          <!-- Logo Icon -->
          <img
            id="logoImg"
            src="./public/logo-icon.webp"
            onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp';"
            alt="Reportalo"
            class="relative w-28 h-32 sm:w-32 sm:h-36 object-contain drop-shadow-[0_12px_24px_rgba(0,0,0,0.45)] select-none transform transition-transform duration-300 group-hover:scale-105"
            draggable="false"
          />
        </div>

      </div>

      <!-- HUD Inferior: Datos de disparo y ayuda táctil -->
      <div class="flex items-center justify-between w-full max-w-[260px] px-2 mt-3 text-[11px] font-mono text-slate-400">
        <span>ISO 100</span>
        <span class="text-slate-300 font-semibold">1/500s • f/1.8</span>
        <span class="text-[#249EE1] font-medium">+0.0 EV</span>
      </div>

      <!-- Hint de interactividad -->
      <p class="mt-6 text-xs font-medium text-slate-400 tracking-wide flex items-center gap-1.5 transition-colors group-hover:text-primary-light">
        <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Toca para capturar</span>
      </p>

    </div>

  </div>

  <script>
    // Sintetizador de sonido de obturador con Web Audio API (100% nativo, sin dependencias)
    function playCameraShutterSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        // Clic de obturador mecánico (ruido blanco filtrado + pulso)
        const bufferSize = ctx.sampleRate * 0.08;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.015));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1200;

        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        noise.start();
      } catch (e) {
        // Audio silencioso si el navegador bloquea autoplay
      }
    }

    // Disparo manual al hacer clic
    const cameraRig = document.getElementById('cameraRig');
    if (cameraRig) {
      cameraRig.addEventListener('click', () => {
        playCameraShutterSound();

        // Aplicar clase de disparo instantáneo
        cameraRig.classList.add('manual-snap');
        const ambientFlash = document.getElementById('ambientFlash');
        if (ambientFlash) {
          ambientFlash.style.opacity = '0.85';
        }

        setTimeout(() => {
          if (ambientFlash) ambientFlash.style.opacity = '0';
          cameraRig.classList.remove('manual-snap');
        }, 180);
      });
    }
  </script>
</body>
</html>
