<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Reportalo - Tu ciudad. Tu voz. Próximamente." />
  <title>Reportalo — Próximamente</title>

  <link rel="icon" type="image/webp" href="./public/logo-icon.webp" />
  <link rel="apple-touch-icon" href="./public/logo-icon.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#249EE1', light: '#EBF6FC', dark: '#266AA6' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      background: #ffffff;
      overflow: hidden;
    }

    /* Entrada suave del logo */
    @keyframes logo-enter {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-camera-box {
      animation: logo-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Visor de cámara: respiración y bloqueo automático */
    @keyframes viewfinder-cycle {
      0%, 100% { transform: scale(1.02); opacity: 0.7; }
      35% { transform: scale(1); opacity: 0.9; }
      48% { transform: scale(0.96); opacity: 1; }
      52% { transform: scale(1.04); opacity: 1; }
      60% { transform: scale(1); opacity: 0.75; }
    }
    .viewfinder-svg {
      animation: viewfinder-cycle 4s ease-in-out infinite;
    }

    /* Dibujo inicial de esquinas */
    @keyframes corner-draw {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .viewfinder-corner {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: corner-draw 1s ease-out 0.2s forwards;
    }

    /* Punto de enfoque central */
    @keyframes focus-indicator {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
      35% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
      48% { transform: translate(-50%, -50%) scale(0.85); opacity: 1; }
      52% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
      65% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
    }
    .focus-point {
      animation: focus-indicator 4s ease-in-out infinite;
    }

    /* Obturación y retroceso físico de disparo */
    @keyframes photo-snap {
      0%, 48% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(0.93); filter: brightness(1.35) drop-shadow(0 0 12px rgba(36, 158, 225, 0.4)); }
      53% { transform: scale(1.03); filter: brightness(1.1); }
      58%, 100% { transform: scale(1); filter: brightness(1); }
    }
    .animate-logo-photo {
      animation: photo-snap 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    /* Destello de flash de captura */
    @keyframes flash-burst {
      0%, 48.5% { opacity: 0; transform: scale(0.8); }
      49.5% { opacity: 0.95; transform: scale(1.15); }
      52% { opacity: 0.6; transform: scale(1.05); }
      56% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; }
    }
    .flash-layer {
      animation: flash-burst 4s ease-out infinite;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased select-none overflow-hidden">

  <div class="min-h-[100dvh] w-full flex flex-col items-center justify-center px-6">

    <!-- Contenedor del Logo con visor de cámara automático -->
    <div class="animate-camera-box relative flex items-center justify-center">

      <!-- Destello de Flash -->
      <div class="flash-layer absolute inset-0 bg-white rounded-full pointer-events-none z-30 shadow-[0_0_80px_40px_rgba(255,255,255,1)]"></div>

      <!-- Visor HUD (Esquinas de encuadre) -->
      <svg class="viewfinder-svg absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] pointer-events-none z-20" viewBox="0 0 130 150" fill="none">
        <!-- Esquina superior izquierda -->
        <path class="viewfinder-corner" d="M8 32 L8 8 L32 8" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Esquina superior derecha -->
        <path class="viewfinder-corner" d="M98 8 L122 8 L122 32" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Esquina inferior izquierda -->
        <path class="viewfinder-corner" d="M8 118 L8 142 L32 142" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Esquina inferior derecha -->
        <path class="viewfinder-corner" d="M98 142 L122 142 L122 118" stroke="#249EE1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <!-- Punto de enfoque central -->
      <div class="focus-point absolute top-1/2 left-1/2 w-2.5 h-2.5 bg-primary rounded-full pointer-events-none z-20 shadow-[0_0_6px_#249EE1]"></div>

      <!-- Logo Icon -->
      <div class="animate-logo-photo relative z-10 select-none">
        <img
          src="./public/logo-icon.webp"
          onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/Mathiiuk/reportalo.mvp/feature/mapa-maplibre-v2/public/logo-icon.webp';"
          alt="Reportalo"
          class="w-28 h-32 object-contain select-none"
          draggable="false"
        />
      </div>

    </div>

  </div>

</body>
</html>
