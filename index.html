<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1E6FCB" />
  <meta name="description" content="Reportalo - Reportá lo que ves en tu ciudad, con evidencia verificada y tu identidad protegida." />
  <title>Reportalo</title>

  <!-- Después de un deploy, el service worker anterior puede entregar este index.html viejo cuando el nuevo ya borró
       sus archivos: el archivo principal da 404 y la pantalla queda en blanco. Se recarga una sola vez, con la misma
       marca y el mismo margen que src/lib/chunkReload.js (que no alcanza: vive dentro de ese archivo). -->
  <script>
    (function () {
      var KEY = 'reportalo_chunk_reload_at';
      window.addEventListener('error', function (event) {
        var el = event.target;
        if (!el || el.tagName !== 'SCRIPT' || !/\/assets\/index-[^/]+\.js$/.test(el.src || '')) return;
        try {
          var last = Number(sessionStorage.getItem(KEY)) || 0;
          if (last && Date.now() - last < 30000) return;
          sessionStorage.setItem(KEY, String(Date.now()));
        } catch (e) {
          return;
        }
        location.reload();
      }, true);
    })();
  </script>

  <!-- Sin hojas de estilo externas: Manrope se sirve desde la app (src/main.jsx) y queda
       en el caché del service worker. Con Google Fonts, el teléfono no pintaba nada hasta
       que respondía fonts.googleapis.com: con poca señal eran ~12 s de pantalla negra. -->

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/webp" href="/logo-icon.webp" />
  <link rel="apple-touch-icon" href="/logo-icon.webp" />
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-900 selection:bg-brand-blue selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
