  - "Selector de zona 'Avellaneda · Centro' interactivo y accesible"
  - "Tarjeta flotante superior izquierda con métrica '128 REPORTES · 7 DÍAS'"
  - "Botón flotante superior derecho para filtros rápidos"
  - "Capa de Heatmap con gradiente de calor y marcadores de incidentes circulares coloreados"
  - "Leyenda inferior izquierda (Menos -> Gradiente verde/naranja/rojo -> Más)"
  - "Botón de geolocalización funcional para centrar en la ubicación del usuario"
  - "Botón de reporte omitido en el mapa ya que se encuentra centralizado en el BottomNav flotante"
