<style>
/* Tokens: Guía de identidad v1.0 (Iván, 03/11/2026), §5 y §7 */
:root{--bg:#F4F7FB;--sf:#FFFFFF;--sf2:#F7F9FC;--bd:#E6ECF3;--sep:#EEF1F5;--tx:#243447;--tx2:#46566B;--tx3:#56657A;--meta:#7A8696;--mut:#8593A2;--ac:#1E6FCB;--ac-tx:#FFFFFF;--ac-soft:#EEF5FC;--ac-line:#D4E6F8;--ok:#2E9E6B;--warn:#E07C1A;--err:#C0392B;--sh:0 2px 10px rgba(20,40,80,.05);--ac-sh:rgba(30,111,203,.28);
  --w-bg:#FFF7EC;--w-bd:#F5E3C8;--w-tx:#7A5220;--pub:#2C7A55;--pub-bg:#E3F5EC;--org:#6B4FC4;--org-bg:#F1EDFC;--sim:#8A5A1E;--sim-bg:#FFF0DC;--rail:#EEF1F5;--lienzo:#E2DFDF;--link-h:#15539E}
body.oscuro{--bg:#16191F;--sf:#21262E;--sf2:#1A1F26;--bd:#343C48;--sep:#2E3542;--tx:#F0F3F8;--tx2:#C2CBD7;--tx3:#A6B1BF;--meta:#939FAD;--mut:#8A96A5;--ac:#F78E35;--ac-tx:#1A1206;--ac-soft:#332615;--ac-line:#513A1A;--ok:#4DCB90;--warn:#E2BA7C;--err:#F2685D;--sh:0 2px 10px rgba(0,0,0,.22);--ac-sh:rgba(247,142,53,.28);
  --w-bg:#332716;--w-bd:#513A1A;--w-tx:#E2BA7C;--pub:#4DCB90;--pub-bg:#173325;--org:#AC90F2;--org-bg:#2A2540;--sim:#E2BA7C;--sim-bg:#332716;--rail:#1A1F26;--lienzo:#E6E8EB;--link-h:#A9540F}
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 14px/1.45 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,select{font-family:inherit;color:inherit}
a{color:var(--ac);text-decoration:none;cursor:pointer} a:hover{color:var(--link-h)}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:15px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:-3px}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p,li{text-wrap:pretty}
/* Documento */
.doc{max-width:1560px;margin:0 auto;padding:22px 24px 60px;display:flex;flex-direction:column;gap:14px}
.cab{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;font:800 17px Manrope;letter-spacing:-.4px;color:var(--tx)}
.logo img{width:17px;height:22px} .logo sup{font-size:.5em;letter-spacing:0}
.cab h1{font:800 18px Manrope;letter-spacing:-.4px} .cab p{font-size:12.5px;color:var(--tx3)}
.bdg{display:inline-flex;align-items:center;gap:4px;font:700 10.5px Manrope;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:8px;white-space:nowrap}
.bdg .ms{font-size:12px}
.b-sim{color:var(--sim);background:var(--sim-bg)} .b-pub{color:var(--pub);background:var(--pub-bg)} .b-org{color:var(--org);background:var(--org-bg)} .b-gris{color:var(--tx3);background:var(--rail)} .b-ac{color:var(--ac);background:var(--ac-soft)}
.selector{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px 12px}
.selector .lbl{font:700 10.5px Manrope;letter-spacing:1.2px;color:var(--mut);text-transform:uppercase;margin-left:4px}
.seg{display:inline-flex;background:var(--rail);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font:600 13px Manrope;color:var(--tx2);cursor:pointer;min-height:34px}
.seg button.on{background:var(--sf);color:var(--ac);font-weight:700;box-shadow:0 1px 3px rgba(20,40,80,.12)}
.seg button:hover:not(.on){background:rgba(0,0,0,.04)}
.esp{flex:1}
.btn2{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ac-line);color:var(--ac);border-radius:10px;padding:8px 12px;font:700 13px Manrope;cursor:pointer;min-height:36px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ac);border:0;color:var(--ac-tx);border-radius:10px;padding:9px 14px;font:800 13px Manrope;cursor:pointer;box-shadow:0 6px 14px var(--ac-sh);min-height:38px}
.btn:active,.btn2:active{transform:scale(.98)}
.btn:disabled,.btn2:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ayuda{font-size:12.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.tit-p{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 7px;border-radius:13px;color:#fff;font:800 12px Manrope}
.num.d{background:#E07C1A} .num.m{background:#2E9E6B}
.tit-p h2{font:800 16px Manrope;letter-spacing:-.3px}
/* Marcos */
.escena{display:flex;gap:28px;align-items:flex-start;justify-content:center}
.nav-br{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 22px 50px rgba(20,40,80,.12);flex:1;min-width:0}
.nav-br .barra{height:38px;background:var(--rail);display:flex;align-items:center;gap:7px;padding:0 12px}
.nav-br .barra i{width:11px;height:11px;border-radius:50%;display:inline-block}
.nav-br .url{flex:1;max-width:760px;margin-left:14px;background:var(--sf);border-radius:7px;padding:4px 10px;font-size:11.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.tel{width:390px;flex:none;background:#161A20;border-radius:38px;padding:9px;box-shadow:0 22px 50px rgba(20,40,80,.20)}
body.oscuro .tel{background:#0B0E13}
.tel .pant{background:var(--bg);border-radius:30px;height:800px;overflow:auto;display:flex;flex-direction:column}
.tel .estado{display:flex;justify-content:space-between;padding:10px 20px 4px;font:700 12px Manrope;background:var(--sf)}
/* App */
.app{container-type:inline-size;background:var(--bg);display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:14px;background:var(--sf);border-bottom:1px solid var(--bd);padding:11px 20px;flex-wrap:wrap}
.top nav{display:flex;gap:4px}
.top nav a{padding:6px 9px;border-radius:8px;color:var(--tx3);font-weight:600}
.top nav a.on{color:var(--ac);font-weight:700}
.icono{background:none;border:0;cursor:pointer;color:var(--tx3);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.icono .ms{font-size:19px}
.avatar{width:30px;height:30px;border-radius:50%;background:#E8F1FB;color:#1E6FCB;display:grid;place-items:center;font:800 11px Manrope}
.franja{display:flex;gap:8px;align-items:center;background:var(--w-bg);border-bottom:1px solid var(--w-bd);color:var(--w-tx);padding:8px 20px;font-size:12px}
.franja.off{background:var(--rail);border-color:var(--bd);color:var(--tx2)}
.cont{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.migas{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.migas a{color:var(--ac)} .migas b{color:var(--tx)} .migas .ms{color:var(--mut);font-size:15px} .migas .lk{color:var(--mut)}
.encab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.encab h3{font:800 26px Manrope;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.encab p{color:var(--tx3);font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dd{display:inline-flex;align-items:center;gap:6px;border:1px solid #E3E9F0;border-radius:9px;padding:0 10px;background:var(--sf);min-height:36px}
body.oscuro .dd{border-color:var(--bd)}
.dd.act{background:var(--ac-soft);border-color:var(--ac-line)}
.dd select{border:0;background:transparent;font:600 12.5px Manrope;padding:7px 0;outline-offset:4px;max-width:240px}
.dd .ms{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--tx3)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--ac);color:var(--ac-tx);border-radius:999px;padding:5px 6px 5px 11px;font:700 12px Manrope;border:0;cursor:pointer;min-height:30px}
.chip .ms{font-size:15px}
.aviso{display:flex;gap:10px;align-items:center;background:var(--ac-soft);border:1px solid var(--ac-line);border-radius:11px;padding:11px 14px;font-size:13px;flex-wrap:wrap}
.aviso>.ms{color:var(--ac);font-size:18px} .aviso .esp{min-width:10px}
.aviso.cau{background:var(--w-bg);border-color:var(--w-bd)} .aviso.cau>.ms{color:var(--warn)}
.k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font:800 25px/1 Manrope;letter-spacing:-.5px;margin-bottom:6px}
.kpi b.ok{color:var(--ok)}
.kpi span{font-size:13px;color:var(--tx2);font-weight:600}
.kpi em{font-style:normal;font-size:12px;color:var(--meta)}
.kpi .bdg{align-self:flex-start;margin-bottom:6px}
.g2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px}
.g2i{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{font:800 13.5px Manrope;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h4 small{font:500 12px Manrope;color:var(--mut)}
.card h4 .bdg{margin-left:auto}
.card .pie{font-size:12px;color:var(--tx3);display:flex;gap:6px;align-items:flex-start}
.card .pie .ms{color:var(--mut)}
.cv{position:relative;height:250px} .cv.bajo{height:190px} .cv.alto{height:320px}
.dona{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.ley{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ley button{display:grid;grid-template-columns:12px 1fr auto 44px;gap:8px;align-items:center;background:none;border:0;padding:5px 6px;border-radius:8px;cursor:pointer;text-align:left;min-height:32px}
.ley button:hover{background:var(--sf2)} .ley button.apag{opacity:.4}
.ley i{width:11px;height:11px;border-radius:3px} .ley .n{font-weight:700;text-align:right} .ley .p{color:var(--mut);text-align:right}
#mapa{height:420px;border-radius:12px;overflow:hidden;background:var(--sf2);position:relative}
body.oscuro #mapa .maplibregl-canvas{filter:brightness(.72) saturate(.85)}
.leyenda-mapa{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.leyenda-mapa .esc{display:flex;align-items:center;gap:4px}
.leyenda-mapa .esc i{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);display:inline-block}
.off{padding:30px;text-align:center;color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:700 10.5px Manrope;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);padding:8px;background:var(--sf2);white-space:nowrap}
td{padding:9px 8px;border-top:1px solid var(--sep);color:var(--tx2)}
td:first-child{color:var(--tx);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sf2)}
td .ms{color:var(--mut)} td.rojo{color:var(--err);font-weight:700}
td input{width:18px;height:18px;accent-color:var(--ac)}
.meta-barra{display:flex;flex-direction:column;gap:12px}
.mb{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:12.5px}
.mb small{display:block;color:var(--mut);font-size:11.5px}
.mb .riel{height:12px;background:var(--rail);border-radius:6px;position:relative}
.mb .riel span{position:absolute;inset:0 auto 0 0;border-radius:6px}
.mb .riel i{position:absolute;top:-4px;bottom:-4px;left:80%;border-left:2px dashed var(--tx3)}
.mb b{text-align:right}
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 16px;color:var(--tx3)}
.vacio .ms{font-size:40px;color:var(--mut)} .vacio b{color:var(--tx);font-size:15px}
.reserva{border:1.5px dashed var(--bd);background:transparent}
.lista{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--tx2)}
.lista li{list-style:none;display:flex;gap:8px;align-items:flex-start}
.lista li .ms{color:var(--warn);font-size:16px}
.cmp{display:grid;gap:0;font-size:13px}
.cmp>div{display:grid;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--sep)}
.cmp>div:first-child{border-top:0}
.cmp .ind{font-weight:700;color:var(--tx)} .cmp .ind small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.cmp .v{font:800 17px Manrope} .cmp .v small{display:block;font:500 11.5px Manrope;color:var(--mut)}
.zchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 8px 5px 10px;font:700 12.5px Manrope;color:#fff;border:0;cursor:pointer}
.zchip i{width:8px;height:8px;border-radius:50%;background:#fff}
/* Navegación inferior del teléfono */
.tabs{display:none}
@container (max-width:700px){
  .top nav,.top .lg-solo{display:none}
  .cont{padding:13px 14px 16px;gap:9px}
  .encab h3{font-size:21px}
  .k4,.k6{grid-template-columns:1fr 1fr;gap:8px}
  .g2,.g2i,.g3{grid-template-columns:1fr;gap:9px}
  .kpi{padding:11px 12px} .kpi b{font-size:19px}
  .dona{grid-template-columns:1fr}
  .cv{height:210px} #mapa{height:340px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--bd);height:52px;margin-top:auto}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10.5px Manrope;color:var(--mut)}
  .tabs a .ms{font-size:20px} .tabs a.on{color:var(--ac);font-weight:800}
  .solo-esc{display:none!important}
  .mb{grid-template-columns:110px 1fr 40px}
  .franja{padding:7px 14px}
}
/* Notas de decisión */
.notas{background:var(--sf);border:1px solid #E9EDF2;border-radius:16px;box-shadow:var(--sh);padding:16px 18px;display:grid;grid-template-columns:2fr 1fr;gap:22px}
body.oscuro .notas{border-color:var(--bd)}
.notas h5{font:800 13px Manrope;display:flex;gap:6px;align-items:center;margin-bottom:8px}
.notas ul{display:grid;gap:7px;font-size:12.5px;color:var(--tx3)}
.notas .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.notas li{list-style:none;display:flex;gap:7px;align-items:flex-start}
.notas li .ms{font-size:15px;flex:none} .i-ok{color:#2E9E6B} .i-r{color:#C0392B} .i-i{color:#8593A2}
.notas .tl{border-left:1px solid var(--sep);padding-left:20px}
@media(max-width:1100px){.escena{flex-direction:column;align-items:center}.nav-br{width:100%}.notas{grid-template-columns:1fr}.notas .cols{grid-template-columns:1fr}.notas .tl{border:0;padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

        <div class="g2">${card('Cómo se calcula cada número', '', `<div class="tw"><table><tr><th>Indicador</th><th>Cálculo</th></tr>${K.map(([a, b]) => `<tr><td>${a}</td><td style="white-space:normal">${b}</td></tr>`).join('')}</table></div>`)}

        ${card('Qué es real y qué está simulado', '', `<div class="tw"><table><tr><th>Elemento</th><th>Origen</th></tr>${[['Territorio: país › provincia › comuna o partido › barrio o localidad', 'Base de staging'], ['Categorías (service_code), 37 prestaciones, 8 estados y open311_status', 'Base de staging'], ['Reportes, fechas, resoluciones y ubicaciones', 'Simulado'], ['Población de 8 barrios', 'Censo 2022'], ['Centro de cada zona en el mapa', 'Aproximado: la base no tiene polígonos']].map(([a, b]) => `<tr><td style="white-space:normal">${a}</td><td>${b}</td></tr>`).join('')}</table></div>`)}`;
    },
    draw() { if (mapa) { mapa.remove(); mapa = null; } } },
};
function migaZona(z) {
  const p = z.zs[0], pasos = ['Argentina', PROV[p.prov], ...(z.tipo === 'barrio' ? [p.sub, z.nombre] : [z.nombre])];
  return `<div class="migas">${pasos.map((t, i) => (i ? ms('chevron_right') : '') + (i === pasos.length - 1 ? `<b>${esc(t)}</b>` : `<span class="lk">${esc(t)}</span>`)).join('')}</div>`;
}

// ======================= Notas de decisión (una tarjeta por pantalla, como en el prototipo de Iván) =======================
const OK = 'check_circle', R = 'priority_high', I = 'info';
const NOTAS = {
  barrio: { t: [ms('home_pin'), 'La puerta de entrada: gratis y pensada primero para el celular'], d: [[OK, 'Responde «¿me lo arreglan?»: % resueltos, días hasta resolver y si el problema vuelve. El volumen queda como contexto.'], [OK, 'Cada cifra se compara con la jurisdicción, nunca con otros barrios.'], [OK, 'Una consulta por día con la cuenta gratuita y la invitación al informe comparativo. Sin precios: eso es horizonte comercial, fuera del MVP.'], [R, 'Toda tendencia lleva la franja «Todavía abiertos» sobre los meses que no tuvieron tiempo de resolverse.'], [OK, 'La torta y las barras filtran el tablero: tocá una categoría o un mes.'], [I, 'A confirmar con el PO: si el vecino gratuito ve una zona o dos (casa y trabajo).']],
    tel: [[OK, 'Es el diseño principal: indicadores de a dos y gráficos a todo el ancho.'], [OK, 'Navegación inferior con las cuatro secciones.'], [OK, '«Comparar con otras zonas» queda al final, después de los datos.']] },
  mapa: { t: [ms('map'), 'Del país al barrio, con los cuatro niveles de la base'], d: [[OK, 'Un círculo por zona, en su centro: el tamaño crece con la cantidad de reportes. Tocar un círculo o una fila baja un nivel.'], [R, 'Escala en un solo color (azul claro a oscuro). El verde-rojo de la guía §7.4 se lee como «zona buena / zona mala», y eso contradice «más reportes no quiere decir peor zona». A confirmar con Iván.'], [OK, 'Período, categoría y prestación filtran el mapa, los indicadores, la tabla y los gráficos a la vez.'], [R, 'Sin ranking: la tabla va en orden por número (comunas) o alfabético (barrios y localidades).'], [OK, 'Con menos de 5 reportes, el círculo va gris y la tabla no muestra porcentajes ni días.'], [I, 'El centro de cada zona es aproximado: la base no tiene polígonos. Mapa real con MapLibre (ADR-007).']],
    tel: [[OK, 'El mapa ocupa el ancho y la tabla queda debajo.'], [OK, 'El selector de nivel se esconde: alcanza con las migas y tocar los círculos.'], [OK, 'Las casillas de comparación ocupan la fila entera.']] },
  comparar: { t: [ms('compare_arrows'), 'Comparar no es rankear'], d: [[OK, 'Hasta 3 zonas de cualquier nivel y jurisdicción, con el mismo criterio Open311.'], [OK, 'Primero la respuesta: % resueltos contra su jurisdicción, días con p90 y problemas que vuelven.'], [OK, 'Días por categoría con el plazo decidido por el PO: Infraestructura 90, Tránsito 7, Ambiente 7 y Comercio irregular 30.'], [OK, 'La tasa cada 10.000 habitantes queda «s/d» donde no hay población oficial.'], [R, 'El orden lo da quien compara, nunca el valor. Los colores identifican zonas, no «mejor» o «peor».'], [I, 'Es el informe pago «Busco dónde vivir». Precio y pago quedan fuera del mockup.']],
    tel: [[OK, 'Las zonas pasan a chips con color y cada indicador muestra las tres cifras en una fila.'], [OK, 'Los gráficos van uno debajo del otro.']] },
  vacios: { t: [ms('location_off'), 'Lo que pasa cuando no hay datos'], d: [[OK, '«Sin reportes» con la Avellaneda de Santa Fe, que está cargada con 0 reportes. Se filtra siempre por provincia + nombre.'], [OK, '«Menos de 5» y «s/d» salen del mismo dataset: son casos reales del simulado, no inventados para la pantalla.'], [OK, 'Sin conexión: franja fija arriba con la fecha y hora de los datos guardados y «Reintentar».'], [I, 'A confirmar con el PO y el Líder Técnico: el umbral de 5 reportes.']],
    tel: [[OK, 'La franja de sin conexión queda fija arriba.'], [OK, 'Los estados vacíos usan el mismo EmptyState que la app del vecino.']] },
  gestion: { t: [ms('dashboard'), 'Tablero de gestión: dónde se acumula el trabajo'], d: [[OK, 'Arranca en la jurisdicción del organismo y no puede subir: las migas superiores quedan bloqueadas (RLS).'], [OK, 'Cada tarjeta dice si es pública o solo del organismo. Lo público tiene las mismas cifras que ve el vecino.'], [OK, 'KPIs de gestión de REP-3906: cumplimiento con meta 80 %, atraso por antigüedad, embudo, primera respuesta, incidentes únicos y puntos crónicos.'], [R, '«Abiertos fuera de plazo» usa el plazo de cada categoría, no un corte fijo de 14 días: 14 días es mucho para Tránsito (7) y poco para Infraestructura (90).'], [R, 'Vulnerabilidad social no aparece. Queda el lugar reservado para «Compromiso social», solo por partido o comuna y para más adelante.'], [I, 'A confirmar con el PO: reincidencia (90 y 30 días), puntos crónicos (3 o más en 30 días) y duplicado (mismo lugar y tipo mientras el primero sigue abierto).']],
    tel: [[OK, 'Indicadores de a dos y gráficos a todo el ancho.'], [OK, 'Las barras de plazo y de atraso se mantienen; el embudo y la primera respuesta quedan para escritorio.'], [OK, 'Las localidades con mucho atrasado se marcan en rojo, con el número al lado.']] },
  metodo: { t: [ms('menu_book'), 'Cada número explica de dónde sale'], d: [[OK, 'Las fórmulas son las del documento de REP-3906 en Confluence.'], [OK, 'Dice qué es real (estructura de la base) y qué es simulado (los reportes).'], [I, 'Pantalla nueva: sigue la numeración desde D61 / M54.']], tel: [[OK, 'Las tablas se desplazan de costado.']] },
};
const notaLi = ([i, t]) => `<li><span class="ms ${i === OK ? 'i-ok' : i === R ? 'i-r' : 'i-i'}">${i}</span><span>${t}</span></li>`;

// ======================= Render =======================
const MENU = [['PÚBLICO', [['barrio', 'Mi barrio'], ['mapa', 'Mapa'], ['comparar', 'Comparar'], ['vacios', 'Sin datos'], ['metodo', 'Metodología']]], ['ORGANISMO', [['gestion', 'Tablero de gestión']]]];
function app(sc, tel) {
  const S = PANT[sc], org = S.vis === 'org';
  const nav = org ? [['', 'Bandeja'], ['', 'Operadores'], ['gestion', 'Tablero']] : [['barrio', 'Mi barrio'], ['mapa', 'Mapa'], ['comparar', 'Comparar'], ['metodo', 'Metodología']];
  return `<div class="app">${tel ? `<div class="estado"><span>9:41</span><span>${ms('signal_cellular_alt')} ${ms('wifi')} ${ms('battery_full')}</span></div>` : ''}
    <div class="top"><span class="logo"><img src="${ICONO}" alt="">Reportalo<sup>™</sup></span><span class="bdg ${org ? 'b-org' : 'b-ac'}">${S.ctx}</span>
      <nav>${nav.map(([k, t]) => `<a class="${k === sc ? 'on' : ''}" ${k ? `data-ir="${k}"` : 'title="Fuera de este mockup"'}>${t}</a>`).join('')}</nav><span class="esp"></span>
      <button class="icono" data-tema aria-label="Cambiar tema">${ms('dark_mode')}</button>${org ? '<span class="avatar lg-solo">OA</span>' : ''}</div>
    ${st.offline ? `<div class="franja off">${ms('cloud_off')}<span>Sin conexión. Estás viendo los datos guardados el ${CORTE.split('-').reverse().join('/')} a las 18:40.</span><span class="esp"></span><a id="reintentar-${tel ? 't' : 'e'}" data-reintentar>Reintentar</a></div>` : ''}
    <div class="franja">${ms('draw')}<span><b>Prototipo con datos simulados.</b> Ninguna cifra es una métrica de Reportalo (REP-3906). Corte: 31/10/2026.</span></div>
    <div class="cont">${S.html()}</div>
    ${org ? '' : `<div class="tabs">${[['barrio', 'home_pin', 'Mi barrio'], ['mapa', 'map', 'Mapa'], ['comparar', 'compare_arrows', 'Comparar'], ['metodo', 'menu_book', 'Metodología']].map(([k, i, t]) => `<a data-ir="${k}" class="${S.tab === k ? 'on' : ''}">${ms(i, S.tab === k ? 'f' : '')}${t}</a>`).join('')}</div>`}</div>`;
}
function render() {
  Object.values(charts).forEach(c => c.destroy()); for (const k in charts) delete charts[k];
  const S = PANT[st.scr], N = NOTAS[st.scr], tel = st.vista === 'tel';
  // El HTML de la pantalla se arma una sola vez: los ids de los gráficos son únicos, así que se muestra escritorio o teléfono, no los dos a la vez con datos.
  $('doc').innerHTML = `<div class="cab"><span class="logo"><img src="${ICONO}" alt="">Reportalo<sup>™</sup></span><div><h1>Observatorio y tablero de gestión · POC v5</h1><p>Identidad y pantallas del prototipo de Iván, con gráficos y filtros que funcionan sobre el dataset simulado de REP-3906</p></div>
      <span class="bdg b-sim">${ms('science')}Prototipo funcional · datos simulados</span><span class="bdg b-gris">Post-MVP</span></div>
    <div class="selector">${MENU.map(([l, xs]) => `<span class="lbl">${l}</span><div class="seg">${xs.map(([k, t]) => `<button data-ir="${k}" class="${st.scr === k ? 'on' : ''}">${t}</button>`).join('')}</div>`).join('')}<span class="esp"></span>
      <span class="lbl">Vista</span><div class="seg"><button data-vista="esc" class="${!tel ? 'on' : ''}">Escritorio</button><button data-vista="tel" class="${tel ? 'on' : ''}">Teléfono</button></div>
      <button class="btn2" data-tema>${ms('dark_mode')}${tema() ? 'Modo claro' : 'Modo oscuro'}</button><button class="btn2" id="notas">${ms('sticky_note_2')}${st.notas ? 'Ocultar notas' : 'Ver notas'}</button></div>
    <div class="ayuda">${ms('touch_app')}Todo filtra de verdad: menú, migas, círculos del mapa, filas, porciones, barras y puntos. Los números salen del CSV simulado (6.000 reportes).</div>
    <div class="tit-p"><span class="num d">${S.d}</span><span class="num m">${S.m}</span><h2>${S.t}</h2>${S.vis === 'org' ? BORG : BPUB}</div>
    <div class="escena">${tel ? `<div class="tel"><div class="pant">${app(st.scr, true)}</div></div>` : `<div class="nav-br"><div class="barra"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span class="url">${ms('lock')}reportalo-staging.vercel.app/${S.url}</span></div>${app(st.scr, false)}</div>`}</div>
    ${st.notas ? `<div class="notas"><div><h5>${N.t.join(' ')}</h5><ul class="cols">${N.d.map(notaLi).join('')}</ul></div><div class="tl"><h5>${ms('smartphone')} En el teléfono</h5><ul>${N.tel.map(notaLi).join('')}</ul></div></div>` : ''}`;
  enlazar();
  S.draw();
}
function enlazar() {
  document.querySelectorAll('[data-ir]').forEach(a => a.onclick = () => { const k = a.dataset.ir; if (k === st.scr) return; if (k !== 'gestion' && st.scr === 'gestion') Object.assign(st, { prov: null, sub: null, loc: null }); st.scr = k; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { st.vista = b.dataset.vista; render(); });
  document.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => { document.body.classList.toggle('oscuro'); render(); });
  $('notas').onclick = () => { st.notas = !st.notas; render(); };
  document.querySelectorAll('[data-reintentar]').forEach(a => a.onclick = () => { st.offline = false; render(); });
  document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { st.per = +b.dataset.per; if (st.mes && st.mes < desde()) st.mes = null; render(); });
  document.querySelectorAll('[data-miga]').forEach(a => a.onclick = () => { Object.assign(st, PASOS_MIGA[+a.dataset.miga]); st.sel = []; render(); });
  document.querySelectorAll('[data-nivel]').forEach(b => b.onclick = () => { const i = +b.dataset.nivel; if (i < 3) { Object.assign(st, PASOS_MIGA[i]); st.sel = []; render(); } });
  document.querySelectorAll('[data-limpiar]').forEach(a => a.onclick = () => { const k = a.dataset.limpiar; if (k === 'todo') Object.assign(st, { svc: '', prest: '', mes: null }); else st[k] = k === 'mes' ? null : ''; render(); });
  document.querySelectorAll('select[data-k]').forEach(s => s.onchange = () => { const k = s.dataset.k;
    if (k === 'agregar') { if (s.value) st.sel = [...st.sel, s.value].slice(0, 3); }
    else if (k === 'sesion') { st.sesion = s.value; Object.assign(st, { prov: null, sub: null, loc: null }); }
    else { st[k] = s.value; if (k === 'svc') st.prest = ''; }
    render(); });
}
// La leyenda de la torta se dibuja después de enlazar: se escucha por delegación
// Enlace directo a una pantalla: #mapa, #gestion,tel, #barrio,oscuro…
location.hash.slice(1).split(',').forEach(x => { if (PANT[x]) st.scr = x; if (x === 'tel') st.vista = 'tel'; if (x === 'oscuro') document.body.classList.add('oscuro'); if (x === 'sinnotas') st.notas = false;
  if (x.startsWith('zona=')) { st.vz = st.consulta = decodeURIComponent(x.slice(5)); } });
document.addEventListener('click', ev => { const b = ev.target.closest('[data-svc]'); if (!b) return; const s = b.dataset.svc; st.svc = st.svc === s ? '' : s; st.prest = ''; render(); });
render();
// Los gráficos se dibujan en canvas: se vuelven a dibujar cuando termina de cargar Manrope
document.fonts?.ready.then(() => render());
</script>
</body>
</html>
