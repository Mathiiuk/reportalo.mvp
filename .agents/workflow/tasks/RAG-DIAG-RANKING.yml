requirements:
  - Script de solo lectura que muestre el ranking completo de recuperacion (incluido lo que queda bajo el umbral) para casos D2-D5
acceptance_criteria:
  - Lee top-k y umbral del fuente de analizar-reporte, sin copiarlos
  - Marca por candidato si supera el umbral, si entra en el top-k y si llega al modelo
  - No genera texto con el modelo, no escribe en la base y no imprime claves
  - Los casos se rotulan exploratorios hasta contar con los reportes originales
