requirements:
  - >-
    Aplicar los bloques del handoff UJ v3.3 preparados por UX (REP-3791) en orden,
    un commit por bloque sobre la rama feat/REP-3787-uj33 derivada de staging
  - >-
    Usar siempre el .patch de cada bloque; nunca copiar la carpeta archivos/,
    que fue generada contra el commit 5898624 y revierte REP-3789 y REP-2500
  - Avanzar por secciones separando desktop y mobile, sin reemplazo monolitico
  - >-
    Conservar props, hooks, servicios, data-testid y textos usados por los tests
    al reemplazar la capa visual
  - No romper los estados offline ni la sincronizacion ya implementados
  - Dejar staging utilizable para QA y para la visualizacion del RAG textual
acceptance_criteria:
  - 'CA-01: cada bloque entregado por Ivo aplica sobre la rama sin conflictos'
  - 'CA-02: tras cada bloque, vitest run no suma fallos nuevos sobre la baseline'
  - 'CA-03: tras cada bloque, vite build compila y el service worker PWA se genera'
  - 'CA-04: desktop y mobile quedan navegables en los recorridos alcanzados'
  - 'CA-05: no se introducen bloqueos en el flujo principal de reporte'
  - 'CA-06: el frontend queda preparado para mostrar la salida del RAG textual'
  - >-
    CA-07: toda diferencia postergada respecto del UJ v3.3 queda documentada en
    el reporte de ejecucion
