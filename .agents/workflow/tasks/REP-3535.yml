title: Implementar landing institucional Municipios (MVP informativo)
type: feat
status: READY_FOR_PR
priority: medium
owner: team-agent
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - src/pages/MunicipiosPage.jsx
    - src/App.jsx
  environments:
    - local
requirements:
  - Landing /municipios según handoff REP-3830 (D21 v2) y decisión PO del 15/10 (solo informativa)
  - Secciones hero, Cómo funciona, Privacidad y marco legal, banda «Ir al portal ciudadano»
  - Sin CTA comerciales (planes, demo, contratación) ni «Ingresar» ni nota de correo oficial
  - «Ir al portal ciudadano» → / sin sesión, /mapa con sesión (propuesta UX, pendiente de OK del PO)
  - /municipalidad/plan redirige a /municipios sin ancla de planes
acceptance_criteria:
  - Secciones informativas en orden (handoff §08)
  - Volver al portal en la misma pestaña al destino según sesión
  - Anclas con scroll suave sin que la barra fija tape el título
  - Sin CTA comerciales, ni deshabilitados ni «próximamente»
  - 390 px sin scroll horizontal, anclas ocultas, CTA ≥ 44 px
  - Anillo de foco en cada enlace y contraste 4.5:1
