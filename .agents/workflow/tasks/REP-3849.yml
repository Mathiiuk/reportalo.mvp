requirements:
  - >-
    Un ciudadano no dueño ve el resumen público de un reporte ajeno sin user_id
    ni client_side_id, aunque pida select=user_id por la API (decisión PO 16/10)
  - >-
    Vista public_citizen_reports con proyección explícita, solo para usuarios
    con sesión
  - >-
    citizen_reports queda para el dueño o quien atiende el reporte; se conserva
    user_id para autoría y autorización
  - El cliente no depende del user_id público para mostrar reportes ajenos
acceptance_criteria:
  - >-
    Con dos cuentas, B obtiene el resumen de A sin user_id ni otro identificador
    del autor
  - El dueño sigue viendo y administrando sus reportes y su evidencia protegida
  - RLS sigue negando fotos, fundamento IA y datos identificatorios a terceros
  - Mapa, detalle y Mis reportes sin cambios visibles
