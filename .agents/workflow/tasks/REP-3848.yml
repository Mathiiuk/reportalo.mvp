id: REP-3848
external_ref: https://unlz2026.atlassian.net/browse/REP-3848
title: 'O-02: fotos privadas sin caché HTTP reutilizable entre sesiones'
type: fix
status: READY_FOR_PR
priority: high
owner: team-agent
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - supabase/migrations/20261019130000_rep3848_evidencias_sin_cache_http.sql
    - supabase/functions/quarantine-anonymize/index.ts
    - src/services/quarantinePipelineService.js
    - src/services/reportSubmissionService.js
  environments:
    - local
requirements:
  - >-
    Las respuestas de fotos privadas (report-evidences, evidence-quarantine) se
    sirven con Cache-Control max-age=0, private, no-store
  - Subidas nuevas (frontend y Edge Function) fijan cacheControl sin caché
  - Objetos ya subidos actualizan metadata.cacheControl por migración
  - Sin flexibilizar RLS ni policies del bucket; sin querystring aleatoria
acceptance_criteria:
  - >-
    Mismo navegador, A descarga su foto, entra B y pide la misma ruta → sin
    contenido (ni caché ni red)
  - En la sesión de A la foto sigue accesible
  - >-
    Las cabeceras muestran no-store y la herramienta de red no muestra «(disk
    cache)»
  - El Service Worker no guarda evidencia
requires_approval: true
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: false
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
