id: REP-3001
external_ref: https://unlz2026.atlassian.net/browse/REP-3001
title: Tomar, escalar, desestimar, discrepancia y resolver con historial
type: feat
status: READY_FOR_PR
priority: high
owner: Matías Krepchuk
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - >-
      supabase/migrations (TOMADO_POR_ORGANISMO + take_report, transiciones,
      índices)
    - src/pages/panel/ (acciones y modal de motivo)
    - src/components/report/ReportTimeline.jsx
    - src/test
  environments:
    - local
requirements:
  - >-
    Tomar = sigue DERIVADO + evento TOMADO_POR_ORGANISMO (quién/cuándo), sin
    duplicar por doble clic
  - >-
    Rechazar → ESCALADO (a quién + por qué) / DESESTIMADO / EN_DISCREPANCIA,
    siempre con motivo; Marcar resuelto → RESUELTO con motivo
  - >-
    Catálogo: quitar ESCALADO→EN_DISCREPANCIA (0 usos en staging) y aprobar las
    otras 5 (Hernán 24/10)
  - RESUELTO/DESESTIMADO no se revierten desde el panel
  - >-
    El vecino ve estados, motivo, destino del escalado y «El organismo tomó tu
    reporte»
acceptance_criteria:
  - Escenarios 1–4 de REP-3001 y casos 1–3 del PO
  - >-
    Historial persistido y lectura ciudadana obligatorios; el historial dentro
    del panel se puede simplificar (Leo)
requires_approval: false
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm build
