id: REP-2500
external_ref: 'https://unlz2026.atlassian.net/browse/REP-2500'
title: Conservar el reporte enviado para consultarlo despues
type: feat
status: PLANNED
priority: medium
owner: Matias Krepchuk
base_branch: staging
tags:
  - reportes
  - persistencia
  - supabase
  - sprint12
scope:
  project: reportalo.mvp
  modules:
    - src/pages/NewReportPage.jsx
    - src/components/report/
    - src/pages/ReportsPage.jsx
    - src/services/
    - supabase/
  environments:
    - staging
    - supabase-real
requirements:
  - >-
    HU (Jira): "Como ciudadano, quiero que el reporte que envié quede guardado
    de forma persistente para poder consultarlo y seguir su evolución
    posteriormente." Sprint 12, stretch goal / prioridad secundaria (no
    integra el Sprint Goal comprometido, se aborda despues de estabilizar el
    RAG textual de REP-2908, ya completo).
  - >-
    HALLAZGO (investigacion previa a esta tarea, sin modificar codigo): hoy el
    envio de un reporte es completamente mock. NewReportPage.jsx no hace
    ningun insert a Supabase; ReportSuccessScreen.jsx muestra un reportCode
    hardcodeado ("#RP-2048"); al llegar a la pantalla de exito se borra el
    unico registro que existia (el borrador local en IndexedDB). Es decir,
    hoy se informa exito sin ninguna persistencia real - exactamente la falla
    que este ticket pide corregir.
  - >-
    La sanitizacion EXIF/metadata ya esta implementada y probada
    (metadataSanitizer.js, quarantinePipelineService.js) y purga la foto
    original de forma fail-safe - pero el resultado sanitizado (sanitizedUrl)
    se descarta al llegar al paso de exito: nunca se copia a un bucket
    definitivo ni se referencia desde ninguna fila persistida.
  - >-
    ReportsPage.jsx ("mis reportes") existe visualmente pero es 100% mock
    (demoReports hardcodeado, sin fetch a Supabase, sin pantalla de detalle).
  - >-
    El esquema de Supabase ya tiene las tablas necesarias
    (citizen_reports, report_images, report_states) - el trabajo es
    conectar el codigo cliente a ese esquema, no crear tablas nuevas
    (salvo que haga falta ajustar algo puntual, a confirmar en el plan).
acceptance_criteria:
  - >-
    AC-01: un envio exitoso genera un registro persistente en
    citizen_reports con identificador unico (id + client_side_id).
  - >-
    AC-02: el registro conserva como minimo usuario (user_id), categoria
    (service_id), descripcion, ubicacion (latitud/longitud + locality_id),
    referencia a la evidencia procesada (report_images.image_url apuntando
    al bucket definitivo, no al de cuarentena), fecha/hora (created_at) y
    estado inicial (current_state_code).
  - >-
    AC-03: el reporte persistido puede recuperarse despues por su
    identificador y por el ciudadano autorizado (RLS: el ciudadano ve sus
    propios reportes, no los de otros).
  - >-
    AC-04: no se almacena la fotografia original ni datos EXIF sin eliminar
    - solo el resultado sanitizado del pipeline de cuarentena existente.
  - >-
    AC-05: un fallo de persistencia NO se informa como envio exitoso al
    ciudadano - la pantalla de exito depende de la confirmacion real del
    insert, no de solo avanzar pasos de UI.
  - >-
    AC-06: evidencia de que QA puede verificar persistencia y recuperacion
    de un reporte de prueba (tests automatizados + pasos manuales
    documentados).
requires_approval: true
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: true
  smoke_tests: true
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm run build
