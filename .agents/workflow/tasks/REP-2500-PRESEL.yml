id: REP-2500-PRESEL
external_ref: https://unlz2026.atlassian.net/browse/REP-2500
title: Preseleccionar la localidad detectada para agilizar el envio del reporte
type: feat
status: MERGED
priority: medium
owner: Matias Krepchuk
base_branch: >-
  feat/REP-3789-preservar-y-visualizar-en-frontend-el-fundamento-juridico-del-rag-textual-detalle-de-reporte-realtime
scope:
  project: reportalo.mvp
  modules:
    - src/services/localityCentroids.js
    - src/pages/NewReportPage.jsx
    - src/components/report/ReportReviewStep.jsx
  environments:
    - local
    - staging
requirements:
  - Preseleccionar la localidad mas cercana a la ubicacion real del dispositivo
  - Mantener la confirmacion del ciudadano, que puede corregir la sugerencia
  - >-
    No sugerir nada cuando no hay lectura real de GPS ni fuera del area
    habilitada
  - No pisar una localidad ya elegida a mano ni la restaurada de un borrador
acceptance_criteria:
  - >-
    CA-01: con GPS concedido y dentro del area, la localidad llega
    preseleccionada
  - 'CA-02: el ciudadano ve que fue detectada automaticamente y puede ajustarla'
  - 'CA-03: sin permiso de GPS no se sugiere nada y el flujo queda como antes'
  - 'CA-04: fuera de CABA/Avellaneda no se sugiere nada'
  - 'CA-05: una eleccion manual o un borrador restaurado tienen prioridad'
requires_approval: true
approval_reason: >-
  Modifica la decision documentada en REP-2500 (seleccion manual de localidad,
  Opcion 1) y toca el punto abierto O-1, asignado a Leonel Nunez y Hernan
  Gregorini. La sugerencia usa centroides aproximados, no poligonos oficiales, y
  el locality_id determina que organismo recibe el reclamo.
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: false
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  bdd_tests: pnpm test:bdd
