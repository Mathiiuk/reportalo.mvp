id: REP-3307
external_ref: "https://jira.reportalo.com/browse/REP-3307"
title: "Configurar ambiente staging"
type: chore
status: IN_PROGRESS
priority: highest
owner: "Matías Krepchuk"
base_branch: staging

scope:
  project: "reportalo.mvp"
  modules: ["infra", "ci-cd", "vercel", "staging"]
  environments: [staging, production]

requirements:
  - "Configurar un entorno de Staging permanente y estable con URL fija en Vercel."
  - "Permitir que el Sponsor (Carlos Ruiz) y el PM (Leonel Nuñez) revisen entregas consolidadas y demos sin que la URL cambie."
  - "Asegurar que los pipelines de CI y Seguridad validen automáticamente la rama staging."

acceptance_criteria:
  - "AC-01: Existe una rama permanente staging en el repositorio GitHub."
  - "AC-02: La rama staging está vinculada a un dominio/alias fijo en Vercel (ej. reportalo-staging.vercel.app)."
  - "AC-03: Cada merge a staging despliega automáticamente la versión consolidada y estable."
  - "AC-04: Los workflows ci.yml y security.yml se ejecutan automáticamente en push a staging."
  - "AC-05: El Sponsor (Carlos Ruiz) puede acceder a la URL fija de Staging públicamente y sin credenciales de Vercel."

constraints:
  - "Plan Vercel Hobby / Free (dominio asignado a rama de Git sin costo adicional)."
  - "El entorno de Staging no debe verse afectado por commits experimentales en ramas de feature."

risks:
  - "Desincronización entre staging y main si no se respeta el flujo de Sprint Review. Mitigado con políticas de merge."

dependencies:
  - "REP-1013 (DevOps / Infraestructura)"
  - "REP-3304 (Vercel Previews)"

requires_approval: false
approval_reason: ""

