requirements:
  - >-
    Cargar el corpus oficial de 8 normas (9 fragmentos vectorizables) verificado
    contra textos consolidados (REP-2906).
  - >-
    Generar chunks con metadatos completos de trazabilidad (norma_codigo,
    titulo, jurisdiccion, autoridad, articulo, fuente_url, tipo_fundamento).
  - >-
    Persistir embeddings y soportar busqueda por similitud de coseno con
    pgvector en Supabase y fallback deterministico in-memory.
  - >-
    Implementar resolucion de jurisdiccion en cascada (Avellaneda -> Municipal +
    PBA + Nacional; CABA -> Municipal + Nacional).
  - >-
    Ejecutar y validar los 6 casos de prueba esperados (A, B, C, D, E y F) de
    REP-3764.
  - >-
    Garantizar que el distractor (Dec-Ley 8031/73) sea descartado en el Caso E y
    que el Caso F devuelva sin fundamento de forma transparente.
  - >-
    Medir y documentar latencia, umbrales de similitud y precision para la
    entrega de Sprint 11.
acceptance_criteria:
  - >-
    AC-01: El corpus incluye los 8 documentos verbatim de REP-2906 trazables a
    norma, articulo, autoridad y fuente consolidada.
  - >-
    AC-02: La busqueda aplica filtro jurisdiccional estricto excluyendo
    normativas incompatibles (ej. CABA en Avellaneda).
  - >-
    AC-03: Los casos A, B, C, D, E y F de REP-3764 pasan con 100% de
    correspondencia segun lo especificado.
  - >-
    AC-04: El Caso E no confunde el distractor Dec-Ley 8031/73 y el Caso F no
    inventa ni alucina citas.
  - >-
    AC-05: El 100% de los tests unitarios y Quality Gates pasan en verde sin
    errores.
quality_gates:
  unit_tests: true
  build: true
commands:
  unit_tests: pnpm test
  build: pnpm run build
