id: REP-2501
external_ref: https://unlz2026.atlassian.net/browse/REP-2501
title: Conservar la evidencia anonimizada del reporte (vinculo, EXIF, purga y acceso)
type: feat
status: READY_FOR_PR
priority: medium
owner: Matias Krepchuk
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - supabase/functions/quarantine-anonymize/index.ts
    - supabase/functions/quarantine-anonymize/exif.ts
    - supabase/functions/quarantine-purge/index.ts
    - supabase/functions/quarantine-purge/purge.ts
    - supabase/migrations/20260923130000_rep2501_evidencia_anonimizada.sql
    - src/services/quarantinePipelineService.js
    - src/services/metadataSanitizer.js
  environments:
    - local
    - staging
requirements:
  - >-
    Solo se almacena la version procesada; la original nunca queda persistida
    (purga de cuarentena)
  - >-
    La evidencia queda vinculada al reporte (URL del bucket de evidencias bajo
    su client_side_id)
  - >-
    La evidencia guardada no conserva metadatos (EXIF, IPTC, XMP, comentarios,
    miniaturas, datos tras el fin de imagen)
  - >-
    Un usuario no autorizado no puede procesar ni borrar fotos ajenas (funcion
    autenticada + carpeta por usuario)
  - >-
    Politica de acceso del MVP - la lectura publica de evidencias anonimizadas
    se mantiene (decision de Matias)
  - Fuera de alcance - el difuminado real de caras y patentes (REP-2400)
acceptance_criteria:
  - >-
    CA-01: report_images solo acepta URLs de report-evidences bajo el
    client_side_id del propio reporte
  - >-
    CA-02: la funcion quarantine-anonymize exige sesion y solo procesa la
    carpeta del usuario
  - 'CA-03: la funcion rechaza lo que no es JPEG y purga el original igualmente'
  - >-
    CA-04: stripExifMetadata quita APP1-APP15 (salvo APP14), comentarios,
    miniatura JFXX y lo posterior al fin de imagen
  - >-
    CA-05: una foto en cuarentena de mas de 1 hora se elimina por purga
    programada
  - >-
    CA-06: el cliente sube a <user_id>/temp_... y convierte a JPEG lo que no lo
    sea
  - 'CA-07: QA verifica asociacion correcta entre reporte y evidencia procesada'
requires_approval: true
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm build
