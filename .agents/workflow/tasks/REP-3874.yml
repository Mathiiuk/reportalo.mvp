id: REP-3874
external_ref: https://unlz2026.atlassian.net/browse/REP-3874
title: Ocultar emails y teléfonos en descripciones para terceros y operadores
type: fix
status: READY_FOR_PR
priority: high
owner: Matías Krepchuk
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - supabase/migrations (vista public_citizen_reports + función de redacción)
    - src/services/reportDetailService.js
    - src/test
  environments:
    - local
requirements:
  - >-
    Redactar mails y teléfonos argentinos en description para terceros y
    operadores, en backend (vista/RPC), también en reportes anteriores
  - El autor conserva el original en Mis reportes y en su detalle
  - >-
    Reemplazos [correo oculto] / [teléfono oculto]; sin falsos positivos en
    artículos de ley, alturas o números de norma
acceptance_criteria:
  - >-
    B consulta por mapa, detalle y REST directa un reporte de A con mail y
    teléfono: el JSON no contiene los valores originales (reporte viejo y nuevo)
  - El operador de prueba recibe la descripción redactada por panel y API
  - >-
    A ve su original; reporte sin datos personales no cambia; 2 pruebas de
    falsos positivos pasan
  - >-
    Siguen sin exponerse user_id, client_side_id, imágenes, fundamento IA ni
    destino a terceros
requires_approval: false
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm build
