title: "Configurar Vercel preview por rama"
type: chore
status: IN_PROGRESS
priority: highest
owner: "Matias Krepchuk"
base_branch: main

scope:
  project: "reportalo.mvp"
  modules: ["infra", "ci-cd", "vercel"]
  environments: [preview, staging, production]

requirements:
  - "Configurar Vercel para generar automáticamente una URL de preview por cada rama o Pull Request."
  - "Permitir que QA (Ivo) valide visualmente los cambios de Matias mediante el link temporal generado."
  - "Operar bajo el plan Free (Hobby) de Vercel sin requerir asientos de pago para QA."

acceptance_criteria:
  - "AC-01: Cada push a rama con PR abierto genera un Preview Deployment en Vercel."
  - "AC-02: El bot de Vercel comenta automáticamente en el PR con la URL del preview."
  - "AC-03: La URL de preview es accesible públicamente sin requerir login o invitación para QA (Ivo)."

constraints:
  - "Plan Vercel Hobby / Free (un solo propietario administrador, enlaces de preview públicos)."
  - "El framework definitivo de la aplicación se definirá en tareas posteriores."

risks:
  - "Asegurar que la configuración en vercel.json sea compatible con el stack que se seleccione."

