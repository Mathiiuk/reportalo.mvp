requirements:
  - >-
    Comparar baseline y variantes A, B y C con corpus, casos y entorno
    constantes
  - >-
    Medir resultado, abstencion, fragmentos y citas, tokens de entrada y salida,
    latencia y truncamientos
  - Probar maxOutputTokens 1024 y la instruccion de concision
  - No implementar cache semantica; no cambiar de proveedor; no tocar el corpus
  - La decision sigue la regla fijada ANTES de correr (ver spec)
  - >-
    Si ninguna variante mejora sin afectar calidad, mantener el baseline y
    documentarlo
acceptance_criteria:
  - >-
    CA-01: tabla comparativa por variante (resultado, abstencion, tokens de
    entrada y salida, latencia)
  - >-
    CA-02: recomendacion final adoptar, adoptar con ajustes o mantener baseline,
    aplicando la regla pre-registrada
  - 'CA-03: evidencia cruda de las corridas versionada en el repo y reproducible'
  - >-
    CA-04: si se adopta un cambio, parametros finales documentados (el cambio en
    produccion va en otra tarea)
  - 'CA-05: el experimento no modifica produccion en ningun punto'
