id: REP-2203
external_ref: https://unlz2026.atlassian.net/browse/REP-2203
title: Escribir descripcion breve del reporte (campo, limite, validacion)
type: feat
status: READY_FOR_PR
priority: medium
owner: Matias Krepchuk
base_branch: staging
scope:
  project: reportalo.mvp
  modules:
    - src/components/report/ReportDetailsStep.jsx
    - src/services/reportDescription.js
    - src/services/reportSubmissionService.js
    - supabase/schema.sql
    - supabase/migrations/20260923120000_rep2203_descripcion_reporte_limite.sql
  environments:
    - local
    - staging
requirements:
  - Campo de descripcion claramente identificado en el paso 2 del reporte
  - Limite del MVP definido con Matias - obligatoria, entre 10 y 280 caracteres
  - Informar el limite con contador y ayuda visible
  - Vacia o fuera de rango - no continua y muestra una indicacion comprensible
  - >-
    Conservar el texto mientras el usuario navega el flujo (y en el borrador
    offline)
  - Misma regla en el servicio de envio y en la base (CHECK)
acceptance_criteria:
  - 'CA-01: el formulario ofrece un campo Descripcion identificado con etiqueta'
  - 'CA-02: el campo admite hasta 280 caracteres'
  - 'CA-03: se informa el limite (entre 10 y 280) y el conteo actual'
  - 'CA-04: con la descripcion vacia el paso 2 no avanza y explica por que'
  - 'CA-05: con menos de 10 caracteres no avanza y indica el minimo'
  - >-
    CA-06: el texto se conserva al ir y volver entre pasos y en el borrador
    offline
  - >-
    CA-07: QA valida descripcion valida, vacia y limite de longitud (tests
    unitarios)
requires_approval: false
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm build
