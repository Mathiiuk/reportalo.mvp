id: REP-ICONS-SWEEP
external_ref: sin ticket Jira dedicado — bug detectado durante REP-2908/2909
title: >-
  Reemplazar iconos Material Symbols por Lucide en toda la app (fuente externa
  fallaba)
type: fix
status: READY_FOR_PR
priority: high
owner: Matias Krepchuk
base_branch: staging
tags:
  - ui
  - iconos
  - lucide
  - bug
scope:
  project: reportalo.mvp
  modules:
    - src/pages/
    - src/components/
  environments:
    - local
requirements:
  - >-
    ReportDetailsStep.jsx (paso 2 de nuevo reporte) tenia IconComponent (Lucide)
    calculado pero sin usar: seguia renderizando un span
    material-symbols-rounded con el nombre literal del icono como texto
    ("construction", "shield", etc). Se detecto que el mismo patron estaba roto
    en 19 archivos mas de la app (paginas y componentes).
  - >-
    Reemplazar cada span material-symbols-rounded por el icono Lucide
    equivalente ya bundleado (SVG), sin depender de que cargue una fuente
    externa (Google Fonts) — la app es offline-first, depender de una fuente
    remota para iconos criticos de la UI es fragil por diseno.
  - >-
    Caso especial: CitizenMap.jsx arma marcadores del mapa con innerHTML (nodo
    DOM plano de MapLibre, no JSX). Se resuelve renderizando el componente
    Lucide a HTML estatico con react-dom/server (renderToStaticMarkup) en vez de
    duplicar SVGs a mano.
  - >-
    Dejar sin tocar el unico caso de icono dinamico basado en datos
    (NewsPage.jsx, item.icon) porque hoy es codigo no alcanzable (newsItems = []
    hardcodeado) — documentado, no arreglado a ciegas.
acceptance_criteria:
  - >-
    AC-01: cero ocurrencias de "material-symbols-rounded" en src/ fuera de la
    definicion de la clase en index.css y el caso dead-code documentado de
    NewsPage.jsx.
  - >-
    AC-02: ningun test verifica el nombre del icono como texto literal (se
    corrigio ProfileFlow.test.jsx, que aserteba screen.getByText('newspaper') —
    estaba probando el bug, no el comportamiento correcto).
  - 'AC-03: pnpm test y pnpm run build pasan en verde.'
  - >-
    AC-04: verificacion visual en el navegador de al menos 2 pantallas (Home,
    Login) confirmando que los iconos renderizan como SVG, no como texto.
requires_approval: false
quality_gates:
  lint: false
  typecheck: false
  unit_tests: true
  bdd_tests: false
  integration_tests: false
  e2e: false
  build: true
  security: false
  smoke_tests: false
commands:
  install: pnpm install
  unit_tests: pnpm test
  build: pnpm run build
