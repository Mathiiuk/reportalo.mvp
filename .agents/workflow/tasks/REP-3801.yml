  - 'CA-03: no se envia el reporte definitivo sin ubicacion ni se inventan coordenadas'
  - 'CA-04: QA reproduce y revalida en staging, incluida la perdida de conexion en pleno flujo y el recorrido online'
  - 'CA-05: quedan vinculados evidencia antes/despues, entorno/version y el PR'
