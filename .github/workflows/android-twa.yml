name: Android TWA

# Compila y firma la app Android (TWA) que se sube a Play Console.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    upload-keystore.jks en base64
#   ANDROID_KEYSTORE_PASSWORD  contraseña del keystore (y de la clave, si no se define otra)
#   ANDROID_KEY_PASSWORD       opcional, si la clave tiene otra contraseña
# Ver docs/android/PLAY_STORE.md

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'android/twa/**'
      - 'public/.well-known/assetlinks.json'
      - 'scripts/android/**'
      - '.github/workflows/android-twa.yml'

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compilar.mjs solo usa módulos nativos de Node: no hace falta pnpm install
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # El runner trae el Android SDK; aseguramos la plataforma que pide la plantilla
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restaurar upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (ver docs/android/PLAY_STORE.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Compilar y firmar
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: |
          chmod +x android/twa/gradlew
          node scripts/android/compilar.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: reportalo-android-${{ github.sha }}
          path: |
            android/twa/dist/app-release-bundle.aab
            android/twa/dist/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Borrar upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
