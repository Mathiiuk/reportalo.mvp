name: Wiki Sync

'on':
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio principal
        uses: actions/checkout@v4

      - name: Sincronizar con GitHub Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki/
          strategy: clone
        env:
          WIKI_ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
